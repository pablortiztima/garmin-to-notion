name: Garmin to Notion Sync

on:
  schedule:
    # 10:00 y 22:00 hora de Chile (13:00 y 01:00 UTC)
    - cron: '0 1,13 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Restore Garmin tokens
        uses: actions/cache@v4
        id: garmin-tokens
        with:
          path: ~/.garmin_tokens
          key: garmin-tokens-${{ github.run_id }}
          restore-keys: |
            garmin-tokens-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GARMIN_TOKENSTORE: ~/.garmin_tokens
          # Bases de Notion: "Sesiones y eventos" e "Implementos"
          NOTION_DB_ID: 14995694e2d1454b8388cf2b7e953437
          NOTION_GEAR_DB_ID: 5ba2c48dc4504bc9a8521a833f21f162
          TIMEZONE: America/Santiago
          # Opcional: ignora actividades anteriores a esta fecha (AAAA-MM-DD). Vacío = todas.
          SYNC_FROM: ${{ vars.SYNC_FROM || '' }}
          GARMIN_ACTIVITIES_FETCH_LIMIT: ${{ vars.GARMIN_ACTIVITIES_FETCH_LIMIT || '1000' }}
          PYTHONPATH: src
        run: python -m garmin_to_notion activities
